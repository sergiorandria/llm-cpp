name: CI
on: [push, pull_request]
jobs:
  build:
    runs-on: ubuntu-latest
strategy:
  matrix:
    numpy: [ON, OFF]
steps:
  - uses: actions/checkout@v4
  - name: Build (numpy=${{matrix.numpy}})
    run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release -DUSE_NUMPY_CPP=${{matrix.numpy}} -DBUILD_TESTS=ON
          cmake --build build -j
          ./build/llm-cpp --help
          ./build/llm-cpp || true
